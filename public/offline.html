<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0F9BA8" />
  <title>لا يوجد اتصال | تكليفات | Takleefat</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #0F9BA8 0%, #1FA97A 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      min-height: 100dvh;
    }
    .card {
      background: #ffffff;
      border-radius: 24px;
      box-shadow: 0 24px 64px rgba(6, 55, 60, 0.35);
      padding: 48px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .badge {
      width: 88px;
      height: 88px;
      margin: 0 auto 24px;
      border-radius: 24px;
      background: linear-gradient(135deg, #0F9BA8 0%, #1FA97A 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 28px rgba(15, 155, 168, 0.35);
    }
    .badge svg { width: 44px; height: 44px; }
    h1 {
      color: #0f172a;
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 12px;
    }
    p {
      color: #64748b;
      font-size: 15px;
      line-height: 1.9;
      margin-bottom: 28px;
    }
    button {
      appearance: none;
      border: 0;
      cursor: pointer;
      width: 100%;
      padding: 14px 24px;
      border-radius: 14px;
      background: linear-gradient(135deg, #0F9BA8 0%, #1FA97A 100%);
      color: #ffffff;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      box-shadow: 0 8px 20px rgba(15, 155, 168, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 12px 26px rgba(15, 155, 168, 0.45); }
    button:active { transform: translateY(0); }
    .hint {
      margin: 20px 0 0;
      font-size: 12.5px;
      color: #94a3b8;
    }
    .brand {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid #e2e8f0;
      font-size: 12.5px;
      font-weight: 700;
      color: #0F9BA8;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge" aria-hidden="true">
      <!-- حافظة تكليفات — نفس هوية الشعار -->
      <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="13.5" y="11.5" width="21" height="25" rx="4" stroke="#FFFFFF" stroke-width="2.4"/>
        <rect x="19" y="8.2" width="10" height="6.4" rx="2.2" fill="#FFFFFF" stroke="#0F9BA8" stroke-width="1.2"/>
        <path d="M24 18.6v7.2M20.4 22.2h7.2" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
        <path d="M19.6 30.4l2.9 2.9 5.9-5.9" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تعذّر تحميل الصفحة لأن الجهاز غير متصل بالشبكة حالياً.
       تحقّق من اتصالك بـ Wi-Fi أو بيانات الجوال ثم أعد المحاولة.</p>
    <button type="button" onclick="window.location.reload()">إعادة المحاولة</button>
    <p class="hint">بياناتك محفوظة بأمان على الخادم — ستظهر فور عودة الاتصال.</p>
    <div class="brand">تكليفات | Takleefat</div>
  </main>
</body>
</html>
